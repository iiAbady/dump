<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<title>CheetaType</title>
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<meta name="description" content="Cheeta typing." />
	<link rel="stylesheet" type="text/css" href="style.css" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
		rel="stylesheet">
</head>

<body>
	<header>
		<h1 class="title"><span>🐆</span> Leopard Typing</h1>
	</header>
	<main>
		<div style="display: flex; justify-content: space-between;">
			<p class="stat"><span class="stat-val" id="roundWPM">N/A</span> WPM</p>
			<p class="stat"><span class="stat-val" id="avgWPM">N/A</span> AVG WPM</p>
			<p class="stat"><span class="stat-val" id="diff">Easy</span> Corpus Difficulty</p>
		</div>
		<p class="text"></p>
		<div class="input-container"><input id="inputText" type="text" name="word" /></div>
		<button type="button" id="new" hidden class="stat-val" style="text-align: center; border: 1px solid goldenrod; background-color: transparent;">New <span class="stat">or (Ctrl + Enter)</span></button>
	</main>

	<footer>

	</footer>
	<script src="./script.js"></script>
</body>

</html>
